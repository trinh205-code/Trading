name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==============================================================
  # 1. BACKEND CI (Spring Boot - Java 17 - Maven)
  # ==============================================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Trading

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run Unit Tests
        run: ./mvnw clean test

      - name: Package JAR
        run: ./mvnw package -DskipTests

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Trading/target/*.jar
          retention-days: 7

  # ==============================================================
  # 2. FRONTEND CI (React + Vite + TypeScript)
  # ==============================================================
  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==============================================================
  # 3. BACKEND CD (Build & Push Docker Image to Docker Hub)
  # ==============================================================
  backend-cd:
    name: Backend Docker Build & Push
    needs: backend-ci
    runs-on: ubuntu-latest
    # Chỉ chạy CD khi push/merge vào main branch và có cấu hình Docker Hub Secrets
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Trading/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Trading
          file: ./Trading/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trading-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trading-backend:${{ github.sha }}
